<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国名山大全 - 方寸屏间，万里河山</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mountains.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" style="color: #64ffda; text-decoration: none;">方寸屏间，万里河山</a>
        </div>
        <nav>
            <ul>
                <li><a href="#" id="returnBtn" class="btn">返回</a></li>  <!-- 改成带id的 -->
            </ul>
        </nav>
    </header>
    
    <section class="page-hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <h1>中国名山大全</h1>
            <p>探索中华大地的壮丽山峰，从五岳到佛教名山，感受"会当凌绝顶，一览众山小"的豪情</p>
        </div>
    </section>
    
    <main class="mountains-grid-container">
    <!-- 搜索功能 -->
    <div class="search-container">
        <input type="text" id="mountainsSearch" placeholder="搜索名山...">
        <div class="search-icon">🔍</div>
        <div class="search-results" id="mountainsResults"></div>
    </div>
    
    <div class="mountains-grid" id="mountainsGrid">
        <!-- 山脉卡片将通过JavaScript动态生成 -->
    </div>
</main>
    
    <footer>
        <p>方寸屏间，万里河山</p>
        <p>2025武汉大学参赛作品| <a href="message-board.html" style="color: #64ffda;">分享你的山河故事</a></p>
    </footer>

    <script src="js/mountains.js"></script>
    
    <!-- 添加返回链接设置代码 -->
    <script>
    // 从URL参数获取来源
    const urlParams = new URLSearchParams(window.location.search);
    const from = urlParams.get('from') || 'category-tags';

    // 根据来源设置不同的返回位置
    let returnSection = 'category-tags';
    if (from.startsWith('more-')) {
        returnSection = from.replace('more-', ''); // more-mountains → mountains
    } else if (from === 'category-tags') {
        returnSection = 'category-tags';
    }

    document.getElementById('returnBtn').href = `index.html#${returnSection}`;
    </script>
</body>
</html>
