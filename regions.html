<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国区域特色大全 - 方寸屏间，万里河山</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/regions.css">
    <style>
        /* 添加Logo样式 */
        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            height: 50px;
            cursor: pointer;
        }

        .logo-image {
            height: 40px;
            width: 40px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            transition: all 0.3s ease;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 600; 
            color: var(--accent-color);
            white-space: nowrap;
            font-family: var(--font-family-primary);
        }

        .logo:hover .logo-image {
            transform: rotate(15deg) scale(1.1);
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.5);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" id="logo">
            <!-- 添加Logo图片 -->
            <img src="images/item/item.jpg" alt="方寸屏间，万里河山" class="logo-image">
            <div class="logo-text">方寸屏间，万里河山</div>
        </div>
        <nav>
            <ul>
                <li><a href="#" id="returnBtn" class="btn">返回</a></li>  
            </ul>
        </nav>
    </header>
    
    <section class="page-hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <h1>中国区域特色大全</h1>
            <p>探索中国多样的地理区域，从北国冰雪到江南水乡，感受"千里不同风，百里不同俗"的地域文化</p>
        </div>
    </section>
    
    <main class="regions-grid-container">
        <div class="search-container">
            <input type="text" id="regionsSearch" placeholder="搜索区域...">
            <div class="search-icon">🔍</div>
            <div class="search-results" id="regionsResults"></div>
        </div>
        
        <div class="regions-grid" id="regionsGrid">
            
        </div>
    </main>
    
    <footer>
        <p>方寸屏间，万里河山</p>
        <p>2025武汉大学参赛作品| <a href="message-board.html" style="color: #64ffda;">分享你的山河故事</a></p>
    </footer>

    <script src="js/regions.js"></script>
    
    <script>
        // Logo点击返回首页功能
        const logo = document.getElementById('logo');
        
        if (logo) {
            // 点击事件：返回首页
            logo.addEventListener('click', function(e) {
                window.location.href = 'index.html';
            });
            
            // 键盘无障碍支持
            logo.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    window.location.href = 'index.html';
                }
            });
            
            // 视觉反馈增强
            logo.style.cursor = 'pointer';
            logo.setAttribute('tabindex', '0');
            logo.setAttribute('role', 'button');
            logo.setAttribute('aria-label', '返回首页');
        }

        // 返回按钮逻辑
        const urlParams = new URLSearchParams(window.location.search);
        const from = urlParams.get('from') || 'category-tags';

        let returnSection = 'category-tags';
        if (from.startsWith('more-')) {
            returnSection = from.replace('more-', ''); // more-regions → regions
        } else if (from === 'category-tags') {
            returnSection = 'category-tags';
        }

        document.getElementById('returnBtn').href = `index.html#${returnSection}`;
    </script>
</body>
</html>
